[package]
name = "oar-ocr-web"
version = "0.1.0"
edition = "2021"
description = "PaddleOCR-compatible web API service powered by oar-ocr (PP-OCRv6 small)"

[dependencies]
oar-ocr = { version = "0.7", features = ["auto-download"] }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
