services:
  oar-ocr-web:
    image: ghcr.io/tabortao/oar-ocr-web:latest
    container_name: oar-ocr-web
    ports:
      - "3000:3000"
    volumes:
      # 持久化 OCR 模型文件（首次启动自动从镜像复制，后续更新无需重新下载）
      - ./models:/app/models
      # 持久化 OCR 请求日志
      - ./logs:/app/logs
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=full
      - OAR_HOME=/app/models
      - PORT=3000
      - LOG_DIR=/app/logs
      - LOG_RETENTION_DAYS=30
    restart: unless-stopped
