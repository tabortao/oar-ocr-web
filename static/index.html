<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR 文字识别 — powered by oar-ocr</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 OCR 文字识别</h1>
            <p class="subtitle">PP-OCRv6 small · oar-ocr · PaddleOCR 兼容 API</p>
        </header>

        <main>
            <!-- 上传区域 -->
            <section class="upload-section">
                <div id="drop-zone" class="drop-zone">
                    <div class="drop-zone-content">
                        <svg class="upload-icon" viewBox="0 0 24 24" width="48" height="48">
                            <path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                        </svg>
                        <p>拖拽图片到此处 或 <span class="browse-link">点击上传</span></p>
                        <p class="hint">支持 JPG / PNG / BMP / WebP</p>
                    </div>
                    <input type="file" id="file-input" accept="image/jpeg,image/png,image/bmp,image/webp,image/tiff" hidden>
                </div>
            </section>

            <!-- 加载状态 -->
            <section id="loading-section" class="loading-section" style="display:none;">
                <div class="spinner"></div>
                <p>正在识别中，请稍候...</p>
            </section>

            <!-- 结果区域 -->
            <section id="result-section" class="result-section" style="display:none;">
                <!-- 图片预览 + 检测框 -->
                <div class="image-preview">
                    <h3>📷 检测结果可视化</h3>
                    <div class="canvas-container">
                        <canvas id="result-canvas"></canvas>
                    </div>
                </div>

                <!-- 文字结果列表 -->
                <div class="text-results">
                    <div class="text-results-header">
                        <h3>📝 识别结果 (<span id="result-count">0</span> 条)</h3>
                        <button id="copy-all-btn" class="btn btn-primary">
                            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                            一键复制
                        </button>
                    </div>
                    <div id="text-list" class="text-list"></div>
                </div>
            </section>

            <!-- 错误提示 -->
            <section id="error-section" class="error-section" style="display:none;">
                <div class="error-card">
                    <span class="error-icon">⚠️</span>
                    <p id="error-message"></p>
                </div>
            </section>
        </main>

        <footer>
            <p>Powered by <a href="https://github.com/quininer/oar" target="_blank">oar-ocr</a> — PP-OCRv6 small</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
