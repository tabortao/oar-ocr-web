name: Build and Publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}

jobs:
  # ===== Build Windows Binary =====
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build Windows executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows executable
        shell: pwsh
        run: |
          $tmp = "dist/oar-ocr-web"
          New-Item -ItemType Directory -Path $tmp -Force
          Copy-Item target/x86_64-pc-windows-msvc/release/oar-ocr-web.exe $tmp/
          Copy-Item -Recurse static $tmp/
          Copy-Item download_models.ps1 $tmp/
          Compress-Archive -Path "$tmp/*" -DestinationPath oar-ocr-web-${{ env.VERSION }}-windows-amd64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: oar-ocr-web-windows-amd64
          path: oar-ocr-web-*.zip

  # ===== Docker Build & Push =====
  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          pull: true

  # ===== Release Binaries =====
  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_prefix: oar-ocr-web-linux-amd64
            rustflags: "-C link-arg=-lstdc++"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_prefix: oar-ocr-web-windows-amd64
            rustflags: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist/oar-ocr-web
          cp target/${{ matrix.target }}/release/oar-ocr-web dist/oar-ocr-web/
          cp -r static dist/oar-ocr-web/
          cp download_models.sh dist/oar-ocr-web/
          cd dist
          tar -czf ${{ matrix.artifact_prefix }}-${{ env.VERSION }}.tar.gz oar-ocr-web

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tmp = "dist/oar-ocr-web"
          New-Item -ItemType Directory -Path $tmp -Force
          Copy-Item target/${{ matrix.target }}/release/oar-ocr-web.exe $tmp/
          Copy-Item -Recurse static $tmp/
          Copy-Item download_models.ps1 $tmp/
          Compress-Archive -Path "$tmp/*" -DestinationPath ${{ matrix.artifact_prefix }}-${{ env.VERSION }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}
          path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
