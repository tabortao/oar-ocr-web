[package]
name = "oar-ocr-web"
version = "0.1.3"
edition = "2021"
description = "PaddleOCR-compatible web API service powered by oar-ocr (PP-OCRv6 small)"

[dependencies]
oar-ocr = { version = "0.7", features = ["auto-download"] }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["webp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
# 静态链接 C/C++ 运行时，避免 glibc 版本依赖
# 注意：此设置对 Windows MSVC 无影响
lto = true
strip = true
opt-level = 3
codegen-units = 1
